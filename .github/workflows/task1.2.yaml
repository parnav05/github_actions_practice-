name: System Info

on:
  workflow_call:
  push:
    branches:
      main
    

jobs:
  System-Info:
    name: task1.2
    runs-on: ubuntu-latest

    steps:

      - name: print current user
        run: whoami

      - name: print hostname
        run: hostname

      - name: print available memory
        run: free -h


      - name: monitering 
        run: top
        continue-on-error: true


      - name:  print disk space
        run: df -h
        
  
      