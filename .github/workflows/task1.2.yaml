name: System Info

on:
  push:
    branches:
      - main

jobs:
  System-Info:
    name: task1.2
    runs-on: ubuntu-latest
    steps:
      - name: print current user
        run: whoami

      - name: print hostname
        run: hostname

      - name: print available memory
        run: free -h

      - name:  print disk space
        run: df -h
      - name:
        run: top 
      