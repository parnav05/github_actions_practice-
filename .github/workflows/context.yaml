name: context

on:
  push:
    branchs:
      main

jobs:
  context:
    runs-on: ubuntu-latest
    env:
      date=
    steps:
      
      - name: github_context
        run: echo " info= build ${{ github.run_number }} on $(date) " >> GITHUB_OUTPUT
      - name: print output
        run:   GITHUB_OUTPUT

#Use `github.run_number` to create a build version string like `"Build #42 on 2024-01-15"`. Use `date` command for the date. 
#Write this to `$GITHUB_OUTPUT` and reference it in the next step.
